<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Nemo – Solver d'emplois du temps</title>
    <link rel="stylesheet" href="/css/table.css">
    <link rel="stylesheet" href="/css/controls.css">
    <link rel="stylesheet" href="/css/calendar.css">
    <link rel="stylesheet" href="/css/students.css">
    <link rel="stylesheet" href="/css/ues.css">

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 2rem;
        }

        fieldset {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-top: 0.5rem;
        }

        .pivot-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.6rem;
        }

        .tab-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 0;
        }

        .tabs {
            display: flex;
            list-style: none;
            padding: 0;
            margin: 0;
            background-color: #f1f1f1;
        }

        .tabs li {
            padding: 10px 20px;
            cursor: pointer;
            background-color: #ddd;
            margin-right: 5px;
            border-radius: 5px 5px 0 0;
        }

        .tabs li.active {
            background-color: #2b7cff;
            color: white;
        }

        .tab-content {
            display: none;
            padding: 20px;
            border: 1px solid #ddd;
            border-top: none;
            flex: 1;
            overflow: auto;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        .tab-content > * {
            flex: 1;
        }

    </style>
</head>

<body>

<h1>Nemo – Gestionnaire des Unités d'Enseignement</h1>

<details class="collapsible">
    <summary>Semestre</summary>
    <form id="semesterForm">
        <fieldset>
            <label>
                Premier lundi
                <input type="date" id="firstMondayInSemester">
            </label>

            <label>
                Dernier lundi
                <input type="date" id="lastMondayInSemester">
            </label>
            <button type="button" id="updateSemesterMondays">Mettre à jour</button>
            <span id="saveSettingsMessage" style="margin-left: 8px;"></span>
        </fieldset>
    </form>
</details>

<div class="tab-container">
    <ul class="tabs">
        <li class="active" onclick="openTab('etudiants')">Étudiants</li>
        <li onclick="openTab('ues')">UEs</li>
        <li onclick="openTab('calendrier')">Calendrier</li>
    </ul>

    <div id="etudiants" class="tab-content active">
    </div>

    <div id="ues" class="tab-content">
    </div>

    <div id="calendrier" class="tab-content">
    </div>
</div>


<script src="/js/index.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/time.js"></script>
<script src="/js/calendar.js"></script>
<script src="/js/students.js"></script>
<script src="/js/ues.js"></script>
<script>

    let teachingUnits = [];
    let teachings = [];
    let lastSelectedTeaching = null;
    let students = [];
    let teachers = [];
    //all the events fixed so far
    let allFixedEvents = [];
    //the events in the current week displayed in the calendar
    let currentWeekEvents = [];
    let unitHues = {};

    document.addEventListener("DOMContentLoaded", async () => {
        await bootstrapFromServer();
        openTab('etudiants');
    });

    async function bootstrapFromServer() {

        try {
            const response = await fetch("/bootstrap", {
                method: "POST"
            });

            const text = await response.text();

            const data = JSON.parse(text);

            console.log("Got bootstrap data...")
            console.log(data)

            firstMondayInSemester = new Date(data.settings.firstMondayInSemester);
            firstMondayInSemester.setHours(0, 0, 0, 0);
            lastMondayInSemester = new Date(data.settings.lastMondayInSemester);
            lastMondayInSemester.setHours(0, 0, 0, 0);
            currentMondayInSemester = new Date(data.settings.firstMondayInSemester);
            currentMondayInSemester.setHours(0, 0, 0, 0);

            document.getElementById("firstMondayInSemester").value = formatDate(firstMondayInSemester);
            document.getElementById("lastMondayInSemester").value = formatDate(lastMondayInSemester);

            teachingUnits = data.teachingUnits || [];

            teachingUnits.forEach(ue => {
                getHueForUnit(ue.id);
                if (Array.isArray(ue.teachings)) {
                    ue.teachings.forEach(t => {
                        t.unitId = ue.id;
                        //t.startDate = getMondayFromWeekString(firstMondayInSemester, t.startDate)
                        // Si des contraintes existent déjà (chargées depuis le JSON), on les conserve
                        if (!t.timeConstraints || t.timeConstraints.length === 0) {
                            // Sinon, on génère les contraintes par défaut
                            const weeksInSemester = getWeekCountBetweenMondays(firstMondayInSemester, lastMondayInSemester);
                            t.timeConstraints = [];
                            for (let week = 1; week <= weeksInSemester; week++) {
                                ["MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY"].forEach(day => {
                                    t.timeConstraints.push({
                                        week: "S" + week,
                                        day: day,
                                        startMinutes: 480,
                                        endMinutes: 1200
                                    });
                                });
                            }
                        }
                        t.selected = false //allows to select or not the teaching to find a solution
                        teachings.push(t);
                    });
                }
            });
            teachings = teachings.sort((a, b) => a.unitId.localeCompare(b.unitId))
            teachingUnits = teachingUnits.sort((a, b) => a.id.localeCompare(b.id))

            students = data.students || [];
            teachers = data.teachers || [];

        } catch (err) {
            console.error("Bootstrap error:", err);
        }
    }

    function buildPayload() {

        return {

            teachings: teachings
                    .filter(t => t.selected) // filter to keep only selected teachings (the teaching table allows to select/unselect them)
                    .map(t => ({
                        id: t.id,
                        type: t.type,
                        durationMinutes: t.durationMinutes,
                        groupCapacity: t.groupCapacity,
                        teacherCount: t.teacherCount,
                        startDate: t.startDate,
                        sessions: t.sessions,
                        sessionsPerWeek: t.sessionsPerWeek,
                        timeConstraints: t.timeConstraints,
                        weeks: t.weeks
                    })),

            students: students.map(s => ({
                id: s.id,
                firstName: s.firstName,
                lastName: s.lastName,
                teachingUnitIds: s.teachingUnitIds
            })),

            allFixedEvents: allFixedEvents.filter(e => e.error === null ).map(e => ({
                teachingId : e.teachingId,
                groupId : e.groupId,
                sessionId : e.sessionId,
                week : e.week,
                day : e.day,
                startMinutes : e.startMinutes,
                endMinutes : e.endMinutes,
                studentIds : e.studentIds,
                error : e.error,
            })),

            settings: {
                pivotStrategy : document.getElementById("pivotStrategy").value,
                currentMonday: formatDate(currentMondayInSemester),
                currentWeek: getWeekStringFromMonday(firstMondayInSemester, currentMondayInSemester),
                formerWeek: getWeekStringFromMonday(firstMondayInSemester, currentMondayInSemester),
                firstMondayInSemester:formatDate(firstMondayInSemester),
                lastMondayInSemester:formatDate(lastMondayInSemester)
            }
        };
    }

    async function saveTeachingUnits() {
        const msgEl = document.getElementById("saveMessage");
        msgEl.textContent = "";

        try {
            const response = await savePayload()
            if (response.ok) {
                msgEl.textContent = "Sauvegarde réussie !";
                msgEl.style.color = "green";
                console.log("Save successful");
            } else {
                msgEl.textContent = "Erreur lors de la sauvegarde";
                msgEl.style.color = "crimson";
                console.error("Save failed:", await response.text());
            }
        } catch (err) {
            msgEl.textContent = "Erreur réseau: " + err.message;
            msgEl.style.color = "crimson";
            console.error("Save error:", err);
        }
    }

    async function saveSettings() {
        const msgEl = document.getElementById("saveSettingsMessage");
        msgEl.textContent = "";

        try {
            const response = await savePayload()
            if (response.ok) {
                msgEl.textContent = "Sauvegarde réussie !";
                msgEl.style.color = "green";
                console.log("Save successful");
            } else {
                msgEl.textContent = "Erreur lors de la sauvegarde";
                msgEl.style.color = "crimson";
                console.error("Save failed:", await response.text());
            }
        } catch (err) {
            msgEl.textContent = "Erreur réseau: " + err.message;
            msgEl.style.color = "crimson";
            console.error("Save error:", err);
        }
    }

    async function savePayload() {
        const payload = {

            teachingUnits: teachingUnits.map(ue => ({
                id: ue.id,
                name: ue.name,
                teachings: teachings
                    .filter(t => t.unitId === ue.id)
                    .map(t => ({
                        id: t.id,
                        type: t.type,
                        durationMinutes: t.durationMinutes,
                        groupCapacity: t.groupCapacity,
                        teacherCount: t.teacherCount,
                        startDate: t.startDate,
                        sessions: t.sessions,
                        sessionsPerWeek: t.sessionsPerWeek,
                        timeConstraints: t.timeConstraints,
                        weeks: t.weeks
                    }))
            })),

            settings: {
                pivotStrategy : document.getElementById("pivotStrategy").value,
                currentMonday: formatDate(currentMondayInSemester),
                currentWeek: getWeekStringFromMonday(firstMondayInSemester, currentMondayInSemester),
                formerWeek: getWeekStringFromMonday(firstMondayInSemester, currentMondayInSemester),
                firstMondayInSemester:formatDate(firstMondayInSemester),
                lastMondayInSemester:formatDate(lastMondayInSemester)
            }
        };

        console.log("Save payload:");
        console.log(payload);

        return await fetch("/save", {
            method: "POST",
            headers: {
                "Content-Type": "sapplication/json"
            },
            body: JSON.stringify(payload)
        });

    }

    async function openTab(tabName) {
        const tabs = document.querySelectorAll('.tab-content');
        tabs.forEach(tab => tab.classList.remove('active'));

        const tabLinks = document.querySelectorAll('.tabs li');
        tabLinks.forEach(link => link.classList.remove('active'));

        const tabContent = document.getElementById(tabName);
        tabContent.classList.add('active');
        if (event) {
            event.currentTarget.classList.add('active');
        } else {
            // Si pas d'événement, trouver le li correspondant à l'onglet et l'activer
            const tabLink = document.querySelector(`.tabs li[onclick="openTab('${tabName}')"]`);
            if (tabLink) {
                tabLink.classList.add('active');
            }
        }

        if (tabName === 'ues' && tabContent.innerHTML.trim() === '') {
            const response = await fetch('ues.html');
            const html = await response.text();
            tabContent.innerHTML = html;
            initUEs();
        } else if (tabName === 'calendrier' && tabContent.innerHTML.trim() === '') {
            const response = await fetch('calendrier.html');
            const html = await response.text();
            tabContent.innerHTML = html;
            initCalendar();
        } else if (tabName === 'etudiants' && tabContent.innerHTML.trim() === '') {
            const response = await fetch('etudiants.html');
            const html = await response.text();
            tabContent.innerHTML = html;
            initStudents();
        }
    }

</script>

</body>
</html>
